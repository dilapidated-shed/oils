name: ysh-d

on:
  pull_request:
    paths:
      - 'ysh/d/**'
      - '.github/workflows/ysh-d.yml'

permissions:
  contents: read

concurrency:
  group: ysh-d-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact YSH translation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Icky DMD bootstrap dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential ldc

      - name: Check out qualified Icky DMD
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: dilapidated-shed/ick
          ref: ccf61ab82659b9eadee2d05b489fb195956cef88
          path: .icky-dmd
          persist-credentials: false

      - name: Build Icky DMD
        shell: bash
        run: |
          set -euxo pipefail
          cd .icky-dmd/dmd/compiler/src
          ldmd2 -run ./build.d dmd HOST_DMD="$(command -v ldmd2)"
          dmd_bin=$(find ../../generated -type f -name dmd -perm -u+x -print -quit)
          test -n "$dmd_bin"
          dmd_bin=$(realpath "$dmd_bin")
          "$dmd_bin" --version
          printf '%s\n' "$dmd_bin" > "$GITHUB_WORKSPACE/.icky-dmd-bin"

      - name: Check out matching druntime source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: dlang/dmd
          ref: 74917954b53f7f35b13e61b4438c7253834929ed
          path: .runtime-dmd
          persist-credentials: false

      - name: Check out matching Phobos source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: dlang/phobos
          ref: 7b158eba80b97dfcdd8931bcaea1ad0ca35ceb95
          path: .runtime-phobos
          persist-credentials: false

      - name: Build matching runtime and Phobos
        shell: bash
        run: |
          set -euxo pipefail
          dmd_bin=$(cat .icky-dmd-bin)
          mkdir -p .runtime-dmd/generated/linux/release/64
          cp "$dmd_bin" .runtime-dmd/generated/linux/release/64/dmd
          chmod +x .runtime-dmd/generated/linux/release/64/dmd
          runtime_dmd="$GITHUB_WORKSPACE/.runtime-dmd/generated/linux/release/64/dmd"

          make -C .runtime-dmd/druntime -j"$(nproc)" \
            MODEL=64 OS=linux BUILD=release SHARED=0 DMD="$runtime_dmd"

          make -C .runtime-phobos -j"$(nproc)" \
            MODEL=64 OS=linux BUILD=release SHARED=0 USE_IMPORTC=1 \
            DMD_DIR="$GITHUB_WORKSPACE/.runtime-dmd" DMD="$runtime_dmd"

          test -f .runtime-dmd/druntime/import/object.d
          test -f .runtime-phobos/generated/linux/release/64/libphobos2.a

      - name: Compile translated YSH with Icky DMD
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ysh/d/.build
          runtime_dmd="$GITHUB_WORKSPACE/.runtime-dmd/generated/linux/release/64/dmd"
          phobos="$GITHUB_WORKSPACE/.runtime-phobos/generated/linux/release/64/libphobos2.a"
          common_flags=(
            -conf= -fPIC -w
            -I"$GITHUB_WORKSPACE/.runtime-dmd/druntime/import"
            -I"$GITHUB_WORKSPACE/.runtime-phobos"
            "$phobos"
            -defaultlib= -debuglib= -L-lpthread -L-lm -L-ldl
          )

          mapfile -t library_sources < <(
            find ysh/d/source/yshd -type f -name '*.d' -print | LC_ALL=C sort
          )
          test "${#library_sources[@]}" -gt 0

          "$runtime_dmd" -unittest -main             "${common_flags[@]}" "${library_sources[@]}"             -of=ysh/d/.build/ysh-d-unittests

          "$runtime_dmd"             "${common_flags[@]}"             ysh/d/source/app.d "${library_sources[@]}"             -of=ysh/d/.build/ysh-d

          test -x ysh/d/.build/ysh-d-unittests
          test -x ysh/d/.build/ysh-d

      - name: Run translated YSH tests and smoke cases
        shell: bash
        run: |
          set -euxo pipefail
          ysh/d/.build/ysh-d-unittests
          actual=$(ysh/d/.build/ysh-d '1 + 2 * 3')
          test "$actual" = 7
          ysh/d/.build/ysh-d -c 'var x = 1; setvar x = 42'
          actual=$(ysh/d/.build/ysh-d -c "var items = ['a b', 'c d']; var answer = 42; write @items; write \$answer \$[6 * 7] @[['x', 'y']]; echo s=\$answer; echo \"value=\$answer\"; write pre\$answer-post; echo hello world; echo -n joined; write one two; write --sep '_' --end ' END' -- alpha beta; write -n x; write y")
          expected=$(printf 'a b\nc d\n42\n42\nx\ny\ns=42\nvalue=42\npre42-post\nhello world\njoinedone\ntwo\nalpha_beta ENDxy\ny\n')
          test "$actual" = "$expected"
